[project]
name = "errand-langgraph"
version = "0.1.0"
description = "Run LangGraph graphs as errand jobs — stateful background execution, HITL resume, and an auto-generated FastAPI router."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jmiguelmangas", email = "jmmangas@gmail.com" }]
keywords = [
  "langgraph",
  "langchain",
  "fastapi",
  "asyncio",
  "background-jobs",
  "agents",
  "human-in-the-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = [
  "errand-jobs>=0.2",
  "langgraph>=0.2",
]

[project.urls]
Homepage = "https://github.com/jmiguelmangas/errand-langgraph"
Repository = "https://github.com/jmiguelmangas/errand-langgraph"
Issues = "https://github.com/jmiguelmangas/errand-langgraph/issues"
Changelog = "https://github.com/jmiguelmangas/errand-langgraph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = [
  "fastapi>=0.100",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "mypy>=1.10",
  "ruff>=0.5",
  "coverage[toml]>=7",
  "uvicorn>=0.30",
  "typing-extensions>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/errand_langgraph"]

[tool.hatch.build.targets.sdist]
exclude = ["assets/", ".github/", "uv.lock"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "ASYNC", "RUF", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's own idiom: Body(...)/Query(...) etc. as call-in-default is how
# it declares request parameters, not a mutable-default bug.
"src/errand_langgraph/fastapi/router.py" = ["B008"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["errand_langgraph"]

[tool.coverage.report]
fail_under = 100
show_missing = true
